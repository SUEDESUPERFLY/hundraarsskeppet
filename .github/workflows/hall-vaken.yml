# Supabase pausar gratisprojekt som inte används på en vecka. Då slutar det gemensamma skeppet fungera i appen
# tills någon väcker projektet. Det här anropet var tredje dag håller databasen vaken.
name: Håll skeppet vaket

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: index.html
          sparse-checkout-cone-mode: false
      - name: Fråga skeppets klocka
        run: |
          CFG=$(grep -o 'window.HS_CFG={[^}]*}' index.html | head -1)
          URL=$(printf '%s' "$CFG" | grep -o '"url": *"[^"]*"' | cut -d'"' -f4)
          KEY=$(printf '%s' "$CFG" | grep -o '"key": *"[^"]*"' | cut -d'"' -f4)
          for i in 1 2 3; do
            if curl -fsS -X POST "$URL/rest/v1/rpc/hs_now" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
                 -H "Content-Type: application/json" -d '{}'; then echo; echo "Skeppet är vaket."; exit 0; fi
            sleep 20
          done
          echo "::error::Fick inget svar från Supabase. Projektet kan vara pausat – väck det i Supabase-panelen."
          exit 1
