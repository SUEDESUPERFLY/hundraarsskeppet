# Bygger Android-appen som AAB för Google Play. Körs manuellt eller när något i android/ ändras.
# Finns hemligheterna UPLOAD_KEYSTORE_B64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS och UPLOAD_KEY_PASSWORD
# blir AAB:n signerad med uppladdningsnyckeln, annars osignerad (signeras då med jarsigner innan uppladdning).
# Resultatet läggs som artefakt och i ett utkast till release.
name: Android-app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Uppladdningsnyckel
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::notice::Ingen uppladdningsnyckel – AAB:n byggs osignerad"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Bygg AAB
        working-directory: android
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace bundleRelease

      - name: Kontrollera AAB och bygg test-APK
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          mkdir -p out
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          cp "$AAB" "out/hundraarsskeppet-$VERSION_NAME.aab"
          gh release download -R google/bundletool --pattern 'bundletool-all-*.jar' -O "$RUNNER_TEMP/bundletool.jar"
          BT="java -jar $RUNNER_TEMP/bundletool.jar"
          echo "::group::bundletool validate"; $BT validate --bundle="$AAB"; echo "::endgroup::"
          echo "::group::Manifest"; $BT dump manifest --bundle="$AAB"; echo "::endgroup::"
          if [ -n "${UPLOAD_KEYSTORE:-}" ]; then
            KS="$UPLOAD_KEYSTORE"; SP="$UPLOAD_STORE_PASSWORD"; KA="$UPLOAD_KEY_ALIAS"; KP="$UPLOAD_KEY_PASSWORD"; SUF=""
          else
            # Ingen uppladdningsnyckel här: test-APK:n signeras med en tillfällig nyckel.
            KS="$RUNNER_TEMP/test.jks"; SP=testtest; KA=test; KP=testtest; SUF="-test"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias test -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$SP" -keypass "$KP" -dname "CN=Hundraarsskeppet test"
          fi
          $BT build-apks --bundle="$AAB" --output="$RUNNER_TEMP/u.apks" --mode=universal \
            --ks="$KS" --ks-pass="pass:$SP" --ks-key-alias="$KA" --key-pass="pass:$KP"
          unzip -p "$RUNNER_TEMP/u.apks" universal.apk > "out/hundraarsskeppet-$VERSION_NAME$SUF.apk"
          rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/test.jks"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: hundraarsskeppet-${{ env.VERSION_NAME }}
          path: out/*

      - name: Utkast till release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-$VERSION_NAME" out/* \
            --draft --target "$GITHUB_SHA" \
            --title "Android $VERSION_NAME (versionCode $VERSION_CODE)" \
            --notes "AAB för Google Play Console och universell APK för testinstallation."
