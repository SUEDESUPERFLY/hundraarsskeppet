# Bygger Android-appen (signerad AAB för Google Play + APK för testinstallation).
# Körs manuellt eller när något i android/ ändras. Resultatet läggs som artefakt och i ett utkast till release.
name: Android-app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Uppladdningsnyckel
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::Hemligheten UPLOAD_KEYSTORE_B64 saknas"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Bygg AAB och APK
        working-directory: android
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace bundleRelease assembleRelease

      - name: Samla filer
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab "out/hundraarsskeppet-$VERSION_NAME.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "out/hundraarsskeppet-$VERSION_NAME.apk"
          ls -l out
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: hundraarsskeppet-${{ env.VERSION_NAME }}
          path: out/*

      - name: Utkast till release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-$VERSION_NAME" out/* \
            --draft --target "$GITHUB_SHA" \
            --title "Android $VERSION_NAME (versionCode $VERSION_CODE)" \
            --notes "Signerad AAB för Google Play Console och APK för testinstallation."
